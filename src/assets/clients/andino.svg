<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none" role="img" aria-label="Centro Comercial Andino">
  <!-- Símbolo Andino: Arco y silueta arquitectónica dorada -->
  <g transform="translate(10, 6)">
    <!-- Arco exterior dorado -->
    <path d="M4 42 C4 42 16 20 32 10 C39 5 44 4 44 4 C44 4 43 9 39 16 C33 26 24 38 4 42 Z" fill="#C5A55D"/>
    <!-- Arco interior de soporte -->
    <path d="M12 43 C22 34 29 24 34 16 C38 10 40 6 40 6 C40 6 42 12 39 20 C35 29 26 38 12 43 Z" fill="#9E7B3B"/>
    <!-- Detalle geométrico base -->
    <line x1="2" y1="44" x2="46" y2="44" stroke="#C5A55D" stroke-width="2"/>
  </g>
  <!-- Texto ANDINO CENTRO COMERCIAL -->
  <text x="66" y="32" font-family="'Cinzel', 'Times New Roman', 'Montserrat', serif" font-size="22" font-weight="800" fill="#1E2229" letter-spacing="3.5">ANDINO</text>
  <text x="67" y="46" font-family="'Inter', system-ui, sans-serif" font-size="7" font-weight="700" fill="#9E7B3B" letter-spacing="3.5">CENTRO COMERCIAL</text>
