<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none" role="img" aria-label="Winner Group Cirsa">
  <!-- Símbolo Winner Group Cirsa: Corona circular y estrella de excelencia -->
  <g transform="translate(10, 6)">
    <!-- Círculo exterior azul oscuro -->
    <circle cx="24" cy="24" r="22" stroke="#0B1B3D" stroke-width="2.5" fill="#FFFFFF"/>
    <circle cx="24" cy="24" r="19" stroke="#E51A24" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>
    <!-- Corona / Arco triunfal -->
    <path d="M12 28 C12 20 18 14 24 14 C30 14 36 20 36 28 C33 22 29 18 24 18 C19 18 15 22 12 28 Z" fill="#E51A24"/>
    <!-- Estrella central -->
    <polygon points="24,17 26,23 32,23 27,27 29,33 24,29 19,33 21,27 16,23 22,23" fill="#0B1B3D"/>
  </g>
  <!-- Texto WINNER GROUP CIRSA -->
  <text x="64" y="30" font-family="'Montserrat', system-ui, sans-serif" font-size="16" font-weight="900" fill="#0B1B3D" letter-spacing="1.5">WINNER GROUP</text>
  <text x="65" y="45" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#E51A24" letter-spacing="4">CIRSA</text>
</svg>
