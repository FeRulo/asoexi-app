<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none" role="img" aria-label="Centro Comercial Unicentro Bogotá">
  <!-- Símbolo Unicentro: Geometría de cintas arquitectónicas entrelazadas -->
  <g transform="translate(8, 6)">
    <!-- Polígono Rojo -->
    <path d="M24 2 L42 12 L34 26 L16 16 Z" fill="#D71920"/>
    <!-- Polígono Ámbar/Dorado -->
    <path d="M42 12 L44 32 L26 44 L24 24 Z" fill="#F5A800"/>
    <!-- Polígono Antracita / Sombra -->
    <path d="M16 16 L24 24 L26 44 L8 34 Z" fill="#1E2229"/>
    <!-- Centro geométrico -->
    <circle cx="26" cy="24" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- Texto UNICENTRO BOGOTÁ -->
  <text x="62" y="32" font-family="'Montserrat', system-ui, sans-serif" font-size="20" font-weight="900" fill="#1E2229" letter-spacing="2">UNICENTRO</text>
  <text x="63" y="47" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#D71920" letter-spacing="4">BOGOTÁ</text>
</svg>
